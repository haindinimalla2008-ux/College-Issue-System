<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - College Issue Management System</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main>

        <section class="login-box">

            <a href="home.html" class="home-button">
                🏠 Home
            </a>

            <h1>Administrator Login</h1>

            <p>Login to manage college complaints</p>


            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
