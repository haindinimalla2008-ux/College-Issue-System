<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint - College Issue Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>College Issue Management System</h1>

    <nav>
        <a href="./index.html">Home</a>
        <a href="./track.html">Track Complaint</a>
        <a href="./admin.html">Admin Dashboard</a>
    </nav>
</header>

<main>
    <section class="complaint-container">

        <h2>Track Your Complaint</h2>

        <input
            type="number"
            id="complaintId"
            placeholder="Enter Complaint ID"
            required
        >

        <button onclick="trackComplaint()">
            Track Complaint
        </button>

        <div id="result"></div>

    </section>
</main>

<script>

async function trackComplaint() {

    const id = document.getElementById("complaintId").value;
    const result = document.getElementById("result");

    if (!id) {
        result.innerHTML = "<p>Please enter Complaint ID.</p>";
        return;
    }

    try {

        const response = await fetch(
            "https://college-issue-system.onrender.com/complaints/" + id
        );

        const data = await response.json();

        if (response.ok) {

            result.innerHTML = `
                <h3>Complaint Found</h3>

                <p><strong>Complaint ID:</strong> ${data.id}</p>
                <p><strong>Name:</strong> ${data.name}</p>
                <p><strong>Role:</strong> ${data.role}</p>
                <p><strong>Category:</strong> ${data.category}</p>
                <p><strong>Location:</strong> ${data.location}</p>
                <p><strong>Priority:</strong> ${data.priority}</p>
                <p><strong>Description:</strong> ${data.description}</p>
                <p><strong>Status:</strong> ${data.status}</p>
            `;

        } else {

            result.innerHTML = "<p>Complaint not found.</p>";

        }

    } catch (error) {

        console.error(error);

        result.innerHTML =
            "<p>Cannot connect to the server.</p>";
    }
}

</script>

</body>
</html>
