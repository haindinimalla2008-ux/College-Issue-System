<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Complaint - College Issue Management System</title>

    <link rel="stylesheet" href="track.css">
</head>

<body>

    <header>

        <h1>College Issue Management System</h1>

        <p>Track Your Complaint</p>

    </header>


    <main>

        <section class="tracking-box">

            <a href="home.html" class="home-button">
                🏠 Home
            </a>

            <h2>Check Complaint Status</h2>

            <label>Complaint ID</label>

            <input
                type="number"
                id="complaintId"
                placeholder="Enter your complaint ID"
                required
            >

            <button onclick="trackComplaint()">
                Check Status
            </button>

            <div id="result"></div>

        </section>

    </main>


    <script src="track.js"></script>

</body>

</html>
