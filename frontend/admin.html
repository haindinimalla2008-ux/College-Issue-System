<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - College Issue Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>College Issue Management System</h1>

    <nav>
        <a href="./index.html">Home</a>
        <a href="./track.html">Track Complaint</a>
        <a href="./admin.html">Admin Dashboard</a>
    </nav>

</header>


<main>

    <section class="complaint-container">

        <h2>Administrator Dashboard</h2>

        <div id="dashboard">
            <p>Loading complaints...</p>
        </div>

        <h2>All Complaints</h2>

        <div id="complaints">
            <p>Loading complaints...</p>
        </div>

    </section>

</main>


<script>

const API =
    "https://college-issue-system.onrender.com";


async function loadDashboard() {

    const dashboard =
        document.getElementById("dashboard");

    const complaintsDiv =
        document.getElementById("complaints");

    try {

        const response =
            await fetch(API + "/complaints");

        if (!response.ok) {
            throw new Error("Failed to load complaints");
        }

        const complaints =
            await response.json();

        let pending = 0;
        let inProgress = 0;
        let resolved = 0;

        complaints.forEach(complaint => {

            if (complaint.status === "Pending") {
                pending++;
            }

            if (complaint.status === "In Progress") {
                inProgress++;
            }

            if (complaint.status === "Resolved") {
                resolved++;
            }

        });


        dashboard.innerHTML = `

            <div>
                <h3>Total Complaints</h3>
                <p>${complaints.length}</p>
            </div>

            <div>
                <h3>Pending</h3>
                <p>${pending}</p>
            </div>

            <div>
                <h3>In Progress</h3>
                <p>${inProgress}</p>
            </div>

            <div>
                <h3>Resolved</h3>
                <p>${resolved}</p>
            </div>

        `;


        if (complaints.length === 0) {

            complaintsDiv.innerHTML =
                "<p>No complaints found.</p>";

            return;
        }


        complaintsDiv.innerHTML = "";


        complaints.forEach(complaint => {

            const div =
                document.createElement("div");


            div.innerHTML = `

                <hr>

                <h3>
                    Complaint #${complaint.id}
                </h3>

                <p>
                    <strong>Name:</strong>
                    ${complaint.name}
                </p>

                <p>
                    <strong>Role:</strong>
                    ${complaint.role}
                </p>

                <p>
                    <strong>Category:</strong>
                    ${complaint.category}
                </p>

                <p>
                    <strong>Location:</strong>
                    ${complaint.location}
                </p>

                <p>
                    <strong>Priority:</strong>
                    ${complaint.priority}
                </p>

                <p>
                    <strong>Description:</strong>
                    ${complaint.description}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${complaint.status}
                </p>

                <label>
                    Update Status:
                </label>

                <select
                    onchange="
                        updateStatus(
                            ${complaint.id},
                            this.value
                        )
                    "
                >

                    <option
                        value="Pending"
                        ${complaint.status === "Pending"
                            ? "selected"
                            : ""}
                    >
                        Pending
                    </option>

                    <option
                        value="In Progress"
                        ${complaint.status === "In Progress"
                            ? "selected"
                            : ""}
                    >
                        In Progress
                    </option>

                    <option
                        value="Resolved"
                        ${complaint.status === "Resolved"
                            ? "selected"
                            : ""}
                    >
                        Resolved
                    </option>

                </select>

            `;


            complaintsDiv.appendChild(div);

        });


    } catch (error) {

        console.error(error);

        dashboard.innerHTML =
            "<p>Cannot connect to the server.</p>";

        complaintsDiv.innerHTML = "";
    }
}


async function updateStatus(id, status) {

    try {

        const response =
            await fetch(
                API + "/complaints/" + id,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );


        const data =
            await response.json();


        if (response.ok) {

            alert(
                "Complaint status updated successfully!"
            );

            loadDashboard();

        } else {

            alert(
                data.message ||
                "Failed to update status."
            );
        }


    } catch (error) {

        console.error(error);

        alert(
            "Cannot connect to the server."
        );
    }
}


loadDashboard();

</script>

</body>
</html>
