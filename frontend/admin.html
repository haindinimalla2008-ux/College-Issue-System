```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>College Issue Management System</h1>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="index.html">
            Complaint Issue
        </a>

        <a href="track.html">
            Track Complaint
        </a>

        <a href="admin.html">
            Admin Dashboard
        </a>

    </nav>

</header>


<main>

    <section class="complaint-container">

        <h2>Administrator Dashboard</h2>

        <div id="dashboard">

            <p>Loading dashboard...</p>

        </div>

    </section>

</main>


<script>

const API =
    "https://college-issue-system.onrender.com";


async function loadDashboard() {

    const dashboard =
        document.getElementById("dashboard");


    try {

        const response =
            await fetch(API + "/complaints");


        if (!response.ok) {

            throw new Error(
                "Failed to load complaints"
            );

        }


        const complaints =
            await response.json();


        let pending = 0;

        let inProgress = 0;

        let resolved = 0;


        complaints.forEach(complaint => {

            if (complaint.status === "Pending") {

                pending++;

            }

            else if (
                complaint.status === "In Progress"
            ) {

                inProgress++;

            }

            else if (
                complaint.status === "Resolved"
            ) {

                resolved++;

            }

        });


        dashboard.innerHTML = `

            <div>

                <h3>Total Complaints</h3>

                <p>
                    ${complaints.length}
                </p>

            </div>


            <div>

                <h3>Pending</h3>

                <p>
                    ${pending}
                </p>

            </div>


            <div>

                <h3>In Progress</h3>

                <p>
                    ${inProgress}
                </p>

            </div>


            <div>

                <h3>Resolved</h3>

                <p>
                    ${resolved}
                </p>

            </div>

        `;

    }

    catch (error) {

        console.error(error);

        dashboard.innerHTML =
            "<p>Cannot connect to the server.</p>";

    }

}


loadDashboard();

</script>

</body>

</html>
```
